name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: pip install -e ".[dev,analysis]"

      - name: Lint (ruff)
        run: ruff check pramaan/ tests/ scripts/

      - name: Type-check (mypy)
        run: mypy pramaan/ scripts/

      - name: Test with coverage
        run: pytest tests/ --cov=pramaan --cov-report=term-missing -W error::DeprecationWarning

      - name: Smoke-test the demo seed script
        run: |
          python scripts/seed_demo_case.py --workspace /tmp/pramaan-demo-ci
          python scripts/seed_demo_case.py --workspace /tmp/pramaan-demo-ci --force

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build (tsc + vite)
        run: npm run build
